<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marchés Publics — Maquette UI/UX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-navy:#0B2545;--color-navy-2:#132F55;--color-navy-3:#1B3A66;
  --color-primary:#0A5BB5;--color-primary-hover:#1E88E5;--color-primary-soft:#E6F0FB;
  --color-gold:#C9A227;--color-gold-dark:#9A7A12;--color-gold-light:#F5E6B8;--color-gold-ink:#2B1F00;
  --color-danger:#C62828;--color-danger-soft:#FBE9E9;
  --color-success:#2E7D32;--color-success-soft:#E7F3E8;
  --color-warning:#E8A317;--color-warning-soft:#FDF3DF;--color-warning-ink:#7A5200;
  --color-bg:#F4F7FB;--color-surface:#FFFFFF;--color-text:#1A2B42;--color-text-muted:#5A6B82;--color-border:#D5DEEA;
  --font-display:'Playfair Display',Georgia,serif;--font-body:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;--font-ar:'IBM Plex Sans Arabic','Inter',sans-serif;
  --radius:8px;--radius-card:12px;
  --shadow-sm:0 1px 2px rgba(11,37,69,.06),0 1px 3px rgba(11,37,69,.05);
  --shadow:0 4px 14px rgba(11,37,69,.08),0 1px 3px rgba(11,37,69,.05);
  --shadow-lg:0 18px 50px rgba(11,37,69,.18);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--color-bg);color:var(--color-text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--color-primary);text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--color-text-muted)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}.ico.lg{width:22px;height:22px}.ico.xl{width:28px;height:28px}
.ar{font-family:var(--font-ar)}
:focus-visible{outline:2px solid var(--color-primary-hover);outline-offset:2px;border-radius:6px}

/* ---------- concept ribbon & plan button ---------- */
.concept{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:90;background:var(--color-gold);color:var(--color-gold-ink);font-size:11px;font-weight:600;padding:3px 14px;border-radius:0 0 8px 8px;letter-spacing:.04em;text-transform:uppercase;box-shadow:var(--shadow-sm);pointer-events:none}
.plan-btn{position:fixed;right:18px;bottom:18px;z-index:95;display:flex;align-items:center;gap:8px;background:var(--color-navy);color:#fff;padding:11px 16px;border-radius:999px;box-shadow:var(--shadow-lg);font-weight:600;font-size:13px;border:1px solid rgba(201,162,39,.5);transition:transform .25s var(--ease)}
.plan-btn:hover{transform:translateY(-2px)}
.plan-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--color-gold);box-shadow:0 0 0 0 rgba(201,162,39,.7);animation:pulse 2s infinite}
.drawer-bg{position:fixed;inset:0;background:rgba(11,37,69,.45);backdrop-filter:blur(3px);z-index:120;opacity:0;pointer-events:none;transition:opacity .3s}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(400px,92vw);background:var(--color-surface);z-index:121;transform:translateX(-102%);transition:transform .4s var(--ease);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.open{transform:none}
.drawer-head{background:var(--color-navy);color:#fff;padding:22px 22px 18px;border-bottom:3px solid var(--color-gold)}
.drawer-head h3{font-family:var(--font-display);font-size:22px;font-weight:600}
.drawer-body{overflow:auto;padding:12px 14px 30px}
.drawer-group{margin-top:14px}
.drawer-group h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted);padding:6px 8px}
.drawer-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--color-text);font-weight:500}
.drawer-link:hover{background:var(--color-bg)}
.drawer-link.active{background:var(--color-primary-soft);color:var(--color-primary)}
.drawer-link .n{margin-left:auto;font-size:11px;color:var(--color-text-muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--radius);font-weight:600;font-size:13.5px;transition:all .2s var(--ease);white-space:nowrap;border:1px solid transparent;position:relative;overflow:hidden}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:hover{background:var(--color-primary-hover);box-shadow:0 6px 16px rgba(10,91,181,.3);transform:translateY(-1px)}
.btn-gold{background:var(--color-gold);color:var(--color-gold-ink)}
.btn-gold:hover{filter:brightness(1.06);box-shadow:0 6px 16px rgba(201,162,39,.35);transform:translateY(-1px)}
.btn-outline{border-color:var(--color-border);background:#fff;color:var(--color-text)}
.btn-outline:hover{border-color:var(--color-primary);color:var(--color-primary)}
.btn-ghost{color:var(--color-text-muted)}
.btn-ghost:hover{background:var(--color-bg);color:var(--color-text)}
.btn-danger{background:var(--color-danger);color:#fff}
.btn-danger:hover{filter:brightness(1.08)}
.btn-success{background:var(--color-success);color:#fff}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px}
.btn-lg{height:48px;padding:0 24px;font-size:15px}
.btn-icon{width:34px;padding:0}
.btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .6s linear;pointer-events:none}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.plain::before{display:none}
.b-success{background:var(--color-success-soft);color:var(--color-success)}
.b-warning{background:var(--color-warning-soft);color:var(--color-warning-ink)}
.b-danger{background:var(--color-danger-soft);color:var(--color-danger)}
.b-primary{background:var(--color-primary-soft);color:var(--color-primary)}
.b-neutral{background:#EDF1F6;color:var(--color-text-muted)}
.b-gold{background:var(--color-gold-light);color:var(--color-gold-ink)}
.b-live::before{animation:pulse 1.6s infinite}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--color-border);background:#fff;font-size:12.5px;font-weight:500;color:var(--color-text);transition:all .2s}
.chip:hover{border-color:var(--color-primary);color:var(--color-primary)}
.chip.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--color-text-muted)}

/* ---------- cards ---------- */
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--color-border)}
.card-head h3{font-size:15px;font-weight:600}
.card-head .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.lift{transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s}
.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#BFCFE3}

.cols>*,.grid>*,.detail-grid>*,.layout-search>*,[style*="display:grid"]>*{min-width:0}
.card-head{flex-wrap:wrap}
/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--color-text-muted)}
.field label .req{color:var(--color-danger)}
.input,.select,.textarea{height:38px;border:1px solid var(--color-border);border-radius:var(--radius);padding:0 12px;background:#fff;width:100%;transition:border-color .2s,box-shadow .2s;font-size:13.5px}
.textarea{height:auto;padding:10px 12px;min-height:84px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(30,136,229,.15)}
.input-icon{position:relative}
.input-icon .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--color-text-muted)}
.input-icon .input{padding-left:38px}
.hint{font-size:12px;color:var(--color-text-muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;font-size:13.5px}
.switch input{display:none}
.switch .tr{width:38px;height:22px;border-radius:999px;background:#C8D3E1;position:relative;transition:background .25s;flex:none}
.switch .tr::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .25s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .tr{background:var(--color-primary)}
.switch input:checked + .tr::after{transform:translateX(16px)}
.seg{display:inline-flex;background:#EDF1F6;border-radius:9px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 13px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--color-text-muted);transition:all .2s}
.seg button.on{background:#fff;color:var(--color-primary);box-shadow:var(--shadow-sm)}
.check{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13.5px}
.check input{width:17px;height:17px;accent-color:var(--color-primary)}
.radio-card{display:flex;gap:12px;padding:14px;border:1.5px solid var(--color-border);border-radius:10px;cursor:pointer;transition:all .2s;background:#fff}
.radio-card:hover{border-color:#A9BDD6}
.radio-card.on{border-color:var(--color-primary);background:var(--color-primary-soft)}
.radio-card .rc-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--color-border);flex:none;margin-top:2px;transition:all .2s}
.radio-card.on .rc-dot{border:5px solid var(--color-primary)}
.radio-card b{display:block;font-size:13.5px}
.radio-card span{font-size:12.5px;color:var(--color-text-muted)}
.reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease),opacity .35s;opacity:0}
.reveal>div{overflow:hidden}
.reveal.open{grid-template-rows:1fr;opacity:1}
.dropzone{border:2px dashed #B9C9DD;border-radius:12px;padding:26px;text-align:center;background:linear-gradient(180deg,#FAFCFE,#F4F7FB);transition:all .25s;cursor:pointer}
.dropzone:hover,.dropzone.drag{border-color:var(--color-primary);background:var(--color-primary-soft)}
.dropzone .ico{width:34px;height:34px;color:var(--color-primary);margin-bottom:8px}

/* ---------- tables ---------- */
.table-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.04em;padding:11px 14px;background:#F8FAFD;border-bottom:1px solid var(--color-border);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid #E7EDF5;vertical-align:middle}
.tbl tr{transition:background .15s}
.tbl tbody tr:hover{background:#F7FAFE}
.tbl tbody tr.click{cursor:pointer}
.tbl .r{text-align:right}
.tbl tbody tr{animation:rowIn .45s var(--ease) both;animation-delay:calc(var(--i,0)*35ms)}
.objet{font-weight:600;color:var(--color-text);max-width:420px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--color-border);overflow-x:auto;position:relative}
.tab{padding:12px 14px;font-weight:600;font-size:13.5px;color:var(--color-text-muted);white-space:nowrap;display:flex;align-items:center;gap:8px;position:relative;transition:color .2s}
.tab:hover{color:var(--color-text)}
.tab.on{color:var(--color-primary)}
.tab .cnt{background:#EDF1F6;color:var(--color-text-muted);font-size:11px;padding:1px 7px;border-radius:999px}
.tab.on .cnt{background:var(--color-primary);color:#fff}
.tab-ink{position:absolute;bottom:-1px;height:3px;background:var(--color-gold);border-radius:3px 3px 0 0;transition:all .35s var(--ease)}

/* ---------- PORTAL ---------- */
.util-bar{background:#071a33;color:#B8C6DA;font-size:12px}
.util-bar .in{max-width:1360px;margin:0 auto;padding:7px 24px;display:flex;gap:18px;align-items:center}
.util-bar a{color:#B8C6DA}.util-bar a:hover{color:#fff}
.util-bar .sp{margin-left:auto;display:flex;gap:16px;align-items:center}
.p-header{background:var(--color-navy);position:sticky;top:0;z-index:50;transition:box-shadow .3s}
.p-header.scrolled{box-shadow:0 6px 24px rgba(0,0,0,.25)}
.p-header .in{max-width:1360px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:12px;color:#fff}
.brand .t1{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.1;white-space:nowrap}
.brand .t2{white-space:nowrap;font-size:11px;color:#9FB2CC;letter-spacing:.06em;text-transform:uppercase}
.p-nav{display:flex;gap:4px}
.p-nav a{color:#C9D6E8;font-weight:500;font-size:14px;padding:8px 12px;white-space:nowrap;border-radius:8px;position:relative;transition:color .2s}
.p-nav a:hover{color:#fff}
.p-nav a.on{color:#fff}
.p-nav a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-2px;height:2px;background:var(--color-gold);border-radius:2px;animation:grow .4s var(--ease)}
.p-header .acts{margin-left:auto;display:flex;gap:10px}
.btn-goldline{border:1px solid var(--color-gold);color:var(--color-gold-light);background:transparent}
.btn-goldline:hover{background:var(--color-gold);color:var(--color-gold-ink)}
.burger{display:none;color:#fff}

.hero{position:relative;overflow:hidden;background:radial-gradient(1200px 500px at 85% -10%,#1E88E5 0%,transparent 60%),linear-gradient(135deg,#0A5BB5 0%,#0B4A94 55%,#0B2545 100%);color:#fff}
.hero .pattern{position:absolute;inset:-50px;opacity:.09;animation:drift 60s linear infinite}
.hero .in{position:relative;max-width:1240px;margin:0 auto;padding:64px 24px 84px;display:grid;grid-template-columns:1.35fr 1fr;gap:48px;align-items:center}
.hero h1{font-family:var(--font-display);font-size:46px;line-height:1.1;font-weight:600;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--color-gold-light)}
.gold-rule{height:3px;width:0;background:linear-gradient(90deg,var(--color-gold),#E6C766);border-radius:3px;margin:22px 0;animation:rule 1.2s .3s var(--ease) forwards}
.hero p.lead{font-size:17px;color:#D6E4F5;max-width:560px}
.searchbox{margin-top:30px;background:#fff;border-radius:14px;padding:8px;box-shadow:0 20px 50px rgba(5,20,45,.35);color:var(--color-text)}
.searchbox .sb-tabs{display:flex;gap:2px;padding:4px 4px 8px}
.searchbox .sb-tabs button{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:7px;color:var(--color-text-muted)}
.searchbox .sb-tabs button.on{background:var(--color-primary-soft);color:var(--color-primary)}
.searchbox .row{display:flex;gap:8px}
.searchbox .row .input-icon{flex:1}
.searchbox .input{height:50px;border:none;background:var(--color-bg);font-size:15px}
.searchbox .select{height:50px;width:190px;border:none;background:var(--color-bg)}
.searchbox .btn{height:50px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.quick .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(4px)}
.quick .chip:hover{background:#fff;color:var(--color-primary)}
.live-panel{background:rgba(7,26,51,.55);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:18px;backdrop-filter:blur(10px);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.live-panel h4{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#fff;margin-bottom:12px}
.feed{display:flex;flex-direction:column;gap:8px;height:300px;overflow:hidden;position:relative}
.feed::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,rgba(9,35,70,.95));pointer-events:none}
.feed-item{display:flex;gap:11px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);animation:feedIn .6s var(--ease) both}
.feed-item .fi-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.feed-item b{font-size:12.5px;font-weight:600;color:#fff;display:block}
.feed-item span{font-size:11.5px;color:#A8BCD6}
.stats-strip{max-width:1240px;margin:-42px auto 0;position:relative;z-index:2;padding:0 24px}
.stats-strip .card{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:22px 24px;border-right:1px solid var(--color-border);position:relative}
.stat:last-child{border-right:none}
.stat .v{font-family:var(--font-display);font-size:34px;font-weight:700;color:var(--color-navy);line-height:1.1}
.stat .l{font-size:13px;color:var(--color-text-muted);margin-top:4px}
.stat .tr{font-size:12px;color:var(--color-success);font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px}
.stat.gold .v{color:var(--color-gold-dark)}
.section{max-width:1240px;margin:0 auto;padding:56px 24px}
.sec-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px}
.sec-head h2{font-family:var(--font-display);font-size:32px;font-weight:600;color:var(--color-navy);line-height:1.15}
.sec-head .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-gold-dark);font-weight:700;margin-bottom:6px}
.sec-head .sp{margin-left:auto}
.announce{background:var(--color-gold-light);border:1px solid #E9D48F;border-radius:14px;padding:18px 22px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.announce::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 4s 1s infinite}
.announce .ai{width:44px;height:44px;border-radius:12px;background:var(--color-gold);color:var(--color-gold-ink);display:grid;place-items:center;flex:none}
.announce b{color:var(--color-gold-ink)}
.announce p{color:#4A3A08;font-size:13.5px}
.ao-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ao-card{padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;cursor:pointer}
.ao-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--color-primary);transform:scaleY(0);transform-origin:top;transition:transform .35s var(--ease)}
.ao-card:hover::after{transform:none}
.ao-card .top{display:flex;align-items:center;gap:8px}
.ao-card .ref{font-family:var(--font-mono);font-size:12px;color:var(--color-text-muted)}
.ao-card h4{font-size:15px;font-weight:600;line-height:1.4;color:var(--color-text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
.ao-card .org{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-text-muted)}
.ao-card .meta{display:flex;gap:14px;flex-wrap:wrap;padding-top:12px;border-top:1px dashed var(--color-border)}
.ao-card .amt{font-family:var(--font-mono);font-weight:600;color:var(--color-navy)}
.cd{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;background:var(--color-primary-soft);color:var(--color-primary)}
.cd.urgent{background:var(--color-danger-soft);color:var(--color-danger);animation:urgent 1.6s infinite}
.cd.soon{background:var(--color-warning-soft);color:var(--color-warning-ink)}
.steps-line{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;position:relative}
.steps-line::before{content:"";position:absolute;top:30px;left:12%;right:12%;height:2px;background:repeating-linear-gradient(90deg,var(--color-gold) 0 8px,transparent 8px 14px)}
.step-it{text-align:center;position:relative}
.step-it .circ{width:60px;height:60px;border-radius:50%;background:#fff;border:2px solid var(--color-gold);display:grid;place-items:center;margin:0 auto 14px;color:var(--color-primary);position:relative;z-index:1;box-shadow:0 0 0 6px var(--color-bg)}
.step-it .circ .n{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--color-navy);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.step-it h5{font-size:15px;font-weight:600;margin-bottom:4px}
.step-it p{font-size:13px;color:var(--color-text-muted)}
.access-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.access-card{border-radius:18px;padding:30px;color:#fff;position:relative;overflow:hidden;min-height:260px;display:flex;flex-direction:column}
.access-card.ent{background:linear-gradient(140deg,#0B2545,#1B3A66)}
.access-card.ach{background:linear-gradient(140deg,#0A5BB5,#0B3D7A)}
.access-card h3{font-family:var(--font-display);font-size:26px;font-weight:600;margin:10px 0 8px}
.access-card ul{list-style:none;display:grid;gap:7px;margin:12px 0 22px;color:#D6E2F2;font-size:13.5px}
.access-card li{display:flex;gap:8px;align-items:center}
.access-card li .ico{color:var(--color-gold)}
.access-card .deco{position:absolute;right:-50px;bottom:-50px;width:230px;height:230px;opacity:.12;transition:transform .8s var(--ease)}
.access-card:hover .deco{transform:rotate(45deg) scale(1.08)}
.p-footer{background:var(--color-navy);color:#9FB2CC;margin-top:30px}
.p-footer .in{max-width:1240px;margin:0 auto;padding:48px 24px 28px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}
.p-footer h5{color:#fff;font-size:13px;margin-bottom:12px;font-weight:600}
.p-footer a{display:block;color:#9FB2CC;font-size:13px;padding:3px 0}
.p-footer a:hover{color:var(--color-gold-light)}
.p-footer .bot{border-top:1px solid rgba(255,255,255,.08);max-width:1240px;margin:0 auto;padding:16px 24px;font-size:12px;display:flex;justify-content:space-between}
.hbar{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center;font-size:13px;padding:6px 0}
.hbar .trk{height:10px;background:#EAF0F7;border-radius:999px;overflow:hidden}
.hbar .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--color-primary),var(--color-primary-hover));transition:width 1.2s var(--ease)}
.hbar.top .fill{background:linear-gradient(90deg,var(--color-gold-dark),var(--color-gold))}

.page-hero{background:linear-gradient(135deg,#0A5BB5,#0B2545);color:#fff;position:relative;overflow:hidden}
.page-hero .in{max-width:1240px;margin:0 auto;padding:36px 24px 40px;position:relative}
.page-hero h1{font-family:var(--font-display);font-size:32px;font-weight:600}
.crumbs{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#B8CBE4;margin-bottom:12px}
.crumbs a{color:#B8CBE4}.crumbs a:hover{color:#fff}
.layout-search{display:grid;grid-template-columns:290px 1fr;gap:24px;align-items:start}
.filters{position:sticky;top:90px}
.filters .fgroup{padding:16px 18px;border-bottom:1px solid var(--color-border)}
.filters .fgroup:last-child{border:none}
.filters h6{font-size:12px;font-weight:700;color:var(--color-text);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.res-item{display:grid;grid-template-columns:1fr auto;gap:18px;padding:18px 20px;border-bottom:1px solid var(--color-border);transition:background .2s;cursor:pointer;animation:rowIn .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.res-item:hover{background:#F7FAFE}
.res-item h4{font-size:15px;font-weight:600;margin:6px 0}
.res-item .side{text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.detail-grid{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.info-list{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.info-list div{padding:14px 20px;border-bottom:1px solid #E7EDF5}
.info-list dt{font-size:11.5px;color:var(--color-text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.info-list dd{font-size:14px;font-weight:500}
.ring-wrap{position:relative;width:150px;height:150px;margin:0 auto}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-wrap .ring-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-wrap .big{font-family:var(--font-mono);font-size:17px;font-weight:600;color:var(--color-navy)}
.ring-bg{stroke:#EAF0F7}.ring-fg{stroke:var(--color-primary);transition:stroke-dashoffset 1.4s var(--ease);stroke-linecap:round}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--color-border)}
.tl-it{position:relative;padding-bottom:18px}
.tl-it::before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--color-border)}
.tl-it.done::before{background:var(--color-success);border-color:var(--color-success)}
.tl-it.now::before{background:var(--color-gold);border-color:var(--color-gold);box-shadow:0 0 0 5px rgba(201,162,39,.2);animation:pulse 2s infinite}
.tl-it b{font-size:13.5px;display:block}
.tl-it span{font-size:12.5px;color:var(--color-text-muted)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .l-art{background:linear-gradient(150deg,#0B2545,#0A5BB5);color:#fff;padding:56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.login .l-art h2{font-family:var(--font-display);font-size:40px;font-weight:600;line-height:1.15;margin-top:auto}
.login .l-form{display:flex;align-items:center;justify-content:center;padding:40px}
.login .l-box{width:100%;max-width:420px}

/* ---------- APP (SI) ---------- */
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
.sidebar{background:var(--color-navy);color:#C2D0E3;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:60}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-brand b{font-family:var(--font-display);color:#fff;font-size:16px;font-weight:600;display:block;line-height:1.1}
.sb-brand span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-gold)}
.sb-search{padding:14px 14px 4px}
.sb-search .input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1);color:#fff;height:36px}
.sb-search .input::placeholder{color:#8FA4C0}
.sb-search .ico{color:#8FA4C0}
.sb-nav{flex:1;overflow:auto;padding:8px 10px 20px}
.sb-sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7088A8;padding:16px 10px 6px;font-weight:600}
.sb-link{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:#C2D0E3;font-weight:500;font-size:13.5px;position:relative;transition:all .2s}
.sb-link:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-link.on{background:rgba(10,91,181,.35);color:#fff}
.sb-link.on::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--color-gold);animation:growY .35s var(--ease)}
.sb-link.on .ico{color:var(--color-gold)}
.sb-link .bdg{margin-left:auto;background:var(--color-gold);color:var(--color-gold-ink);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}
.sb-link .bdg.r{background:var(--color-danger);color:#fff}
.sb-user{border-top:1px solid rgba(255,255,255,.07);padding:14px 16px;display:flex;align-items:center;gap:11px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--color-gold),#E6C766);color:var(--color-gold-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.avatar.b{background:linear-gradient(135deg,var(--color-primary),var(--color-primary-hover));color:#fff}
.sb-user b{color:#fff;font-size:13px;display:block}
.sb-user span{font-size:11.5px;color:#8FA4C0}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--color-border);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:40}
.topbar .crumb{font-size:13px;color:var(--color-text-muted);display:flex;gap:8px;align-items:center}
.topbar .crumb b{color:var(--color-text);font-weight:600}
.topbar .sp{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--color-text-muted);position:relative;transition:all .2s}
.icon-btn:hover{background:var(--color-bg);color:var(--color-text)}
.icon-btn .pip{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--color-danger);border:2px solid #fff;animation:pulseR 2s infinite}
.role-sw{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--color-border);border-radius:10px;background:#fff;font-weight:600;font-size:12.5px}
.content{padding:26px 28px 80px;max-width:1440px;width:100%}
.page-title{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-title h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
.page-title p{color:var(--color-text-muted);font-size:13.5px;margin-top:2px}
.page-title .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi .k-top{display:flex;align-items:center;gap:10px;color:var(--color-text-muted);font-size:12.5px;font-weight:600}
.kpi .k-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.kpi .k-v{font-size:28px;font-weight:700;margin-top:12px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .k-v small{font-size:14px;font-weight:600;color:var(--color-text-muted);margin-left:4px}
.kpi .k-d{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:5px}
.kpi .spark{position:absolute;right:14px;bottom:14px;width:90px;height:34px}
.kpi.gold{border-color:#E4CF86;background:linear-gradient(160deg,#FFFDF6,#fff)}
.kpi.gold::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--color-gold),#E6C766)}
.kpi.gold .k-v{color:var(--color-gold-dark)}
.up{color:var(--color-success)}.down{color:var(--color-danger)}
.ic-p{background:var(--color-primary-soft);color:var(--color-primary)}
.ic-s{background:var(--color-success-soft);color:var(--color-success)}
.ic-w{background:var(--color-warning-soft);color:var(--color-warning-ink)}
.ic-d{background:var(--color-danger-soft);color:var(--color-danger)}
.ic-g{background:var(--color-gold-light);color:var(--color-gold-dark)}
.ic-n{background:#EDF1F6;color:var(--color-text-muted)}
.cols{display:grid;gap:20px}
.c-2-1{grid-template-columns:2fr 1fr}.c-1-1{grid-template-columns:1fr 1fr}.c-3-2{grid-template-columns:3fr 2fr}.c-1-2{grid-template-columns:1fr 2fr}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:20px}
.pipe-st{position:relative;padding:14px 16px;cursor:pointer;border-radius:10px;transition:background .2s}
.pipe-st:hover{background:var(--color-bg)}
.pipe-st .pv{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.pipe-st .pl{font-size:12.5px;color:var(--color-text-muted);font-weight:600}
.pipe-st .pb{height:6px;border-radius:999px;margin-top:12px;background:#EAF0F7;overflow:hidden}
.pipe-st .pb i{display:block;height:100%;width:0;border-radius:999px;transition:width 1.2s var(--ease)}
.pipe-st:not(:last-child)::after{content:"";position:absolute;right:-6px;top:50%;width:12px;height:12px;border-top:2px solid #C8D3E1;border-right:2px solid #C8D3E1;transform:translateY(-50%) rotate(45deg)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #EDF2F8;transition:background .2s}
.list-row:last-child{border-bottom:none}
.list-row:hover{background:#F8FAFD}
.list-row .lr-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.list-row .lr-m{min-width:0;flex:1}
.list-row .lr-m b{font-size:13.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .lr-m span{font-size:12px;color:var(--color-text-muted)}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding:10px 20px 0}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .bstack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;height:0;transition:height 1s var(--ease);position:relative}
.bars .bstack:hover{filter:brightness(1.1)}
.bars .bl{font-size:11px;color:var(--color-text-muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--color-text-muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;margin-bottom:20px;animation:slideDown .5s var(--ease)}
.banner.gold{background:var(--color-gold-light);border:1px solid #E9D48F;color:var(--color-gold-ink)}
.banner.info{background:var(--color-primary-soft);border:1px solid #BDD6F2;color:#0A3F7E}
.banner.warn{background:var(--color-warning-soft);border:1px solid #F1D49A;color:var(--color-warning-ink)}
.banner .sp{margin-left:auto}
.stepper{display:flex;gap:0;padding:18px 20px;overflow-x:auto}
.stp{display:flex;align-items:center;gap:10px;flex:1;min-width:max-content;cursor:pointer;position:relative;padding-right:16px}
.stp .sn{width:30px;height:30px;border-radius:50%;border:2px solid var(--color-border);display:grid;place-items:center;font-weight:700;font-size:12.5px;color:var(--color-text-muted);background:#fff;transition:all .3s var(--ease);flex:none}
.stp .st{font-size:13px;font-weight:600;color:var(--color-text-muted);transition:color .3s}
.stp .st small{display:block;font-weight:500;font-size:11.5px}
@media (max-width:1600px){.stp .st small{display:none}}
.stp:not(:last-child)::after{content:"";flex:1;height:2px;background:var(--color-border);margin-left:6px;min-width:20px}
.stp.done .sn{background:var(--color-success);border-color:var(--color-success);color:#fff}
.stp.done:not(:last-child)::after{background:var(--color-success)}
.stp.cur .sn{background:var(--color-primary);border-color:var(--color-primary);color:#fff;box-shadow:0 0 0 5px rgba(10,91,181,.15)}
.stp.cur .st{color:var(--color-text)}
.form-sec{padding:22px 24px;border-bottom:1px solid var(--color-border)}
.form-sec:last-child{border-bottom:none}
.form-sec h4{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.form-sec h4 .ico{color:var(--color-primary)}
.lot{border:1px solid var(--color-border);border-radius:10px;padding:14px;background:#FAFCFE;animation:fadeUp .4s var(--ease)}
.lot-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lot-h .ln{width:26px;height:26px;border-radius:7px;background:var(--color-navy);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.preview{position:sticky;top:84px}
.pv-card{border-radius:12px;border:1px solid var(--color-border);overflow:hidden}
.pv-card .pv-top{background:linear-gradient(135deg,#0A5BB5,#0B2545);color:#fff;padding:14px 16px}
.pv-card .pv-top h5{font-size:14px;font-weight:600;margin-top:6px;min-height:20px}
.checklist{display:grid;gap:8px}
.checklist div{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--color-text-muted);transition:color .3s}
.checklist div .cbx{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--color-border);display:grid;place-items:center;transition:all .3s var(--ease)}
.checklist div.ok{color:var(--color-text)}
.checklist div.ok .cbx{background:var(--color-success);border-color:var(--color-success);color:#fff}
.progress{height:8px;background:#EAF0F7;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-primary-hover));border-radius:999px;transition:width .6s var(--ease)}
.progress.gold i{background:linear-gradient(90deg,var(--color-gold-dark),var(--color-gold))}
.status-flow{display:flex;padding:18px 20px;gap:0;overflow-x:auto}
.sf{flex:1;text-align:center;position:relative;min-width:110px}
.sf .d{width:16px;height:16px;border-radius:50%;margin:0 auto 8px;background:#fff;border:3px solid var(--color-border);position:relative;z-index:1}
.sf::before{content:"";position:absolute;top:7px;left:-50%;right:50%;height:2px;background:var(--color-border)}
.sf:first-child::before{display:none}
.sf.done .d{border-color:var(--color-success);background:var(--color-success)}
.sf.done::before{background:var(--color-success)}
.sf.now .d{border-color:var(--color-gold);background:#fff;box-shadow:0 0 0 6px rgba(201,162,39,.2);animation:pulse 2s infinite}
.sf.now::before{background:linear-gradient(90deg,var(--color-success),var(--color-gold))}
.sf b{font-size:12.5px;font-weight:600;display:block}
.sf span{font-size:11.5px;color:var(--color-text-muted)}
.reg{padding:18px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.reg .rv{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.reg .rv small{font-size:14px;color:var(--color-text-muted);font-weight:600}
.action-list{display:flex;flex-direction:column}
.action-list button{display:flex;align-items:center;gap:11px;padding:11px 18px;text-align:left;font-size:13.5px;font-weight:500;border-bottom:1px solid #EDF2F8;transition:all .2s}
.action-list button:hover:not([disabled]){background:var(--color-primary-soft);color:var(--color-primary);padding-left:22px}
.action-list button[disabled]{color:#A9B6C7;cursor:not-allowed}
.action-list button .ico{color:inherit}
.action-list button.danger:hover:not([disabled]){background:var(--color-danger-soft);color:var(--color-danger)}
.env-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.env{padding:16px;border-radius:12px;border:1px solid var(--color-border);background:#fff;position:relative;overflow:hidden}
.env .lock-anim{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--color-navy);color:var(--color-gold);margin-bottom:10px;transition:all .5s var(--ease)}
.env.open .lock-anim{background:var(--color-success);color:#fff;transform:rotate(-8deg) scale(1.05)}
.msg-layout{display:grid;grid-template-columns:360px 1fr;min-height:620px}
.msg-list{border-right:1px solid var(--color-border);overflow:auto}
.msg-item{padding:14px 18px;border-bottom:1px solid #EDF2F8;cursor:pointer;transition:background .2s;display:flex;gap:11px}
.msg-item:hover{background:#F8FAFD}
.msg-item.on{background:var(--color-primary-soft);box-shadow:inset 3px 0 0 var(--color-primary)}
.msg-item b{font-size:13px;display:block}
.msg-item p{font-size:12.5px;color:var(--color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcpt{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:999px;background:var(--color-primary-soft);color:var(--color-primary);font-size:12.5px;font-weight:600;margin:3px}
.tree{font-size:13px}
.tree details{margin-left:16px}
.tree>details{margin-left:0}
.tree summary{list-style:none;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-weight:500}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover{background:var(--color-bg)}
.tree summary .chev{transition:transform .25s;color:var(--color-text-muted)}
.tree details[open]>summary .chev{transform:rotate(90deg)}
.tree .leaf{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 34px;color:var(--color-text-muted);border-radius:7px}
.tree .leaf:hover{background:var(--color-bg);color:var(--color-text)}
.tree .folder-ic{color:var(--color-gold)}
.co-card{padding:18px;display:flex;flex-direction:column;gap:10px}
.co-logo{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px}
.key-card{padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.key-card .kc-ico{width:46px;height:46px;border-radius:12px;background:var(--color-navy);color:var(--color-gold);display:grid;place-items:center}
.key-card.secours{border-color:#E4CF86}
.key-card.secours::after{content:"SECOURS";position:absolute;top:14px;right:-30px;transform:rotate(45deg);background:var(--color-gold);color:var(--color-gold-ink);font-size:10px;font-weight:700;padding:3px 34px;letter-spacing:.08em}
.donut-wrap{display:flex;align-items:center;gap:24px;padding:20px}
.donut-wrap svg circle{transition:stroke-dasharray 1.2s var(--ease),stroke-dashoffset 1.2s var(--ease)}
.doc-card{padding:16px;display:flex;gap:14px;align-items:flex-start}
.doc-ic{width:42px;height:50px;border-radius:6px;background:linear-gradient(180deg,#fff,#F0F4FA);border:1px solid var(--color-border);display:grid;place-items:center;position:relative;flex:none;color:var(--color-primary)}
.doc-ic::after{content:"";position:absolute;top:-1px;right:-1px;border-style:solid;border-width:0 12px 12px 0;border-color:transparent var(--color-bg) transparent transparent}
.validity{height:6px;background:#EAF0F7;border-radius:999px;overflow:hidden;margin-top:8px}
.validity i{display:block;height:100%;border-radius:999px;width:0;transition:width 1.2s var(--ease)}
.cert{padding:16px;border:1.5px solid var(--color-border);border-radius:12px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:all .2s;background:#fff}
.cert.on{border-color:var(--color-primary);background:var(--color-primary-soft)}
.cert .ci{width:46px;height:46px;border-radius:12px;background:var(--color-navy);color:var(--color-gold);display:grid;place-items:center;flex:none}
.proc-steps{display:grid;gap:14px}
.proc{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--color-border);background:#fff;transition:all .4s var(--ease)}
.proc .pi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#EDF1F6;color:var(--color-text-muted);flex:none;transition:all .4s}
.proc.run{border-color:var(--color-primary)}
.proc.run .pi{background:var(--color-primary-soft);color:var(--color-primary)}
.proc.run .pi .ico{animation:spin 1s linear infinite}
.proc.ok{border-color:#B9DDBB;background:#F7FCF7}
.proc.ok .pi{background:var(--color-success);color:#fff;animation:pop .4s var(--ease)}
.proc .progress{flex:1;max-width:220px}
.receipt{max-width:640px;margin:0 auto;padding:0;overflow:hidden;animation:fadeUp .6s var(--ease)}
.receipt .rh{background:var(--color-success);color:#fff;padding:26px;text-align:center}
.receipt .rh .big-check{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--color-success);display:grid;place-items:center;margin:0 auto 12px;animation:pop .6s var(--ease)}
.receipt .rb{padding:24px}
.receipt .rrow{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px dashed var(--color-border);font-size:13.5px}
.receipt .rrow span{color:var(--color-text-muted)}
.hash{font-family:var(--font-mono);font-size:11.5px;word-break:break-all;background:var(--color-bg);padding:10px 12px;border-radius:8px;color:var(--color-navy)}
.diag{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid #EDF2F8}
.diag .di{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#EDF1F6;color:var(--color-text-muted);transition:all .4s}
.diag.run .di{background:var(--color-primary-soft);color:var(--color-primary)}
.diag.run .di .ico{animation:spin 1s linear infinite}
.diag.ok .di{background:var(--color-success);color:#fff;animation:pop .4s}
.diag.warn .di{background:var(--color-warning);color:var(--color-gold-ink);animation:pop .4s}
.ring-sm{width:110px;height:110px;position:relative}
.ring-sm svg{transform:rotate(-90deg)}
.ring-sm .ring-c{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:22px;color:var(--color-navy)}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.mini-cal .dh{color:var(--color-text-muted);font-weight:600;font-size:11px;padding:4px 0}
.mini-cal .dd{padding:7px 0;border-radius:7px;position:relative}
.mini-cal .dd.ev::after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--color-primary)}
.mini-cal .dd.ev.u::after{background:var(--color-danger)}
.mini-cal .dd.today{background:var(--color-navy);color:#fff;font-weight:700}
.mini-cal .dd.mute{color:#B6C2D2}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(11,37,69,.5);backdrop-filter:blur(4px);z-index:200;display:grid;place-items:center;padding:20px;animation:fade .25s}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:modalIn .35s var(--ease)}
.modal.wide{width:min(760px,100%)}
.modal-h{padding:20px 24px;border-bottom:1px solid var(--color-border);display:flex;align-items:center;gap:12px}
.modal-h h3{font-size:17px;font-weight:600}
.modal-b{padding:22px 24px}
.modal-f{padding:16px 24px;border-top:1px solid var(--color-border);display:flex;justify-content:flex-end;gap:10px;background:#FAFCFE}
.toasts{position:fixed;right:20px;bottom:78px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:12px;background:var(--color-navy);color:#fff;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow-lg);min-width:280px;max-width:380px;animation:toastIn .45s var(--ease);font-size:13.5px;border-left:4px solid var(--color-gold)}
.toast.success{border-left-color:#5CB860}.toast.danger{border-left-color:#EF5350}
.toast.out{animation:toastOut .35s var(--ease) forwards}

/* animations */
[data-a]{animation:fadeUp .6s var(--ease) both;animation-delay:calc(var(--d,0)*70ms)}
.view-enter{animation:viewIn .45s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes feedIn{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,162,39,.6)}70%{box-shadow:0 0 0 9px rgba(201,162,39,0)}100%{box-shadow:0 0 0 0 rgba(201,162,39,0)}}
@keyframes pulseR{0%{box-shadow:0 0 0 0 rgba(198,40,40,.5)}70%{box-shadow:0 0 0 7px rgba(198,40,40,0)}100%{box-shadow:0 0 0 0 rgba(198,40,40,0)}}
@keyframes urgent{50%{background:#F8D7D7}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-120px,-120px)}}
@keyframes rule{to{width:120px}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes shine{to{transform:translateX(100%)}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:400;pointer-events:none;animation:confetti 2.6s cubic-bezier(.3,.6,.5,1) forwards}
.skel{background:linear-gradient(90deg,#EDF1F6 25%,#F6F8FB 50%,#EDF1F6 75%);background-size:200% 100%;animation:skel 1.2s infinite;border-radius:6px}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* countdown chip */
function cdChip(t){return `<span class="cd" data-deadline="${t}">${ic('clock','sm')}<span>—</span></span>`}
function fmtLeft(ms){
  if(ms<=0)return 'Clôturée';
  const d=Math.floor(ms/D),h=Math.floor(ms%D/H),m=Math.floor(ms%H/6e4),s=Math.floor(ms%6e4/1e3);
  if(d>0)return `${d}j ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m`;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function tickCountdowns(){
  document.querySelectorAll('[data-deadline]').forEach(el=>{
    const left=+el.dataset.deadline-Date.now();
    const sp=el.querySelector('span')||el;
    sp.textContent=fmtLeft(left);
    el.classList.toggle('urgent',left>0&&left<D*1.5);
    el.classList.toggle('soon',left>=D*1.5&&left<D*5);
    if(left<=0){el.classList.remove('urgent','soon')}
  });
}
setInterval(tickCountdowns,1000);

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const badge=s=>`<span class="badge ${STAT_BADGE[s]||'b-neutral'}">${s}</span>`;
function toast(msg,type='info'){
  let w=$('.toasts');if(!w){w=document.createElement('div');w.className='toasts';document.body.appendChild(w)}
  const t=document.createElement('div');t.className='toast '+type;
  t.innerHTML=`${ic(type==='success'?'check':type==='danger'?'alert':'bell')}<div>${msg}</div>`;
  w.appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),400)},3600);
}
function modal(title,body,foot='',wide=false){
  closeModal();
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="modal-h"><h3>${title}</h3><button class="icon-btn" style="margin-left:auto" data-close>${ic('x')}</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:''}</div>`;
  bg.addEventListener('click',e=>{if(e.target===bg||e.target.closest('[data-close]'))closeModal()});
  document.body.appendChild(bg);enhance(bg);return bg;
}
function closeModal(){$$('.modal-bg').forEach(m=>m.remove())}
function confetti(){
  const cols=['#C9A227','#0A5BB5','#1E88E5','#2E7D32','#F5E6B8'];
  for(let i=0;i<70;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.animationDelay=Math.random()*.6+'s';c.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),3400)}
}
function ringSVG(pct,size=150,stroke=10,color){
  const r=(size-stroke)/2,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}"><circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}"/><circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}" ${color?`style="stroke:${color}"`:''} stroke-dasharray="${c}" stroke-dashoffset="${c}" data-ring="${c*(1-pct)}"/></svg>`;
}
function spark(vals,color='#0A5BB5'){
  const w=90,h=34,mx=Math.max(...vals),mn=Math.min(...vals);
  const pts=vals.map((v,i)=>[i*(w/(vals.length-1)),h-3-((v-mn)/(mx-mn||1))*(h-6)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${color}" opacity=".08"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" data-draw/></svg>`;
}
function donut(parts,size=150){
  const r=size/2-14,c=2*Math.PI*r,tot=parts.reduce((a,p)=>a+p.v,0);let off=0;
  const segs=parts.map(p=>{const len=p.v/tot*c;const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="0 ${c}" data-dash="${len-2} ${c-len+2}" stroke-dashoffset="${-off}" />`;off+=len;return s}).join('');
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EAF0F7" stroke-width="20"/>${segs}</svg>`;
}
function lineChart(series,labels,h=220){
  const W=640,P=34,mx=Math.max(...series.flatMap(s=>s.v))*1.15;
  const x=i=>P+i*((W-P-10)/(labels.length-1)),y=v=>h-28-(v/mx)*(h-46);
  let g='';for(let i=0;i<=4;i++){const yy=h-28-i*(h-46)/4;g+=`<line x1="${P}" x2="${W-10}" y1="${yy}" y2="${yy}" stroke="#EDF2F8"/><text x="${P-8}" y="${yy+4}" text-anchor="end" font-size="10.5" fill="#5A6B82">${Math.round(mx*i/4)}</text>`}
  const lab=labels.map((l,i)=>`<text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#5A6B82">${l}</text>`).join('');
  const lines=series.map(s=>{const d=s.v.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    return `${s.area?`<path d="${d} L${x(s.v.length-1)} ${h-28} L${P} ${h-28}Z" fill="${s.c}" opacity=".08"/>`:''}<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" data-draw ${s.dash?'style="stroke-dasharray:4 5"':''}/>`+s.v.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="${s.c}" stroke-width="2"><title>${labels[i]} : ${v}</title></circle>`).join('')}).join('');
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" style="display:block">${g}${lab}${lines}</svg>`;
}

/* effects after render */
function enhance(root=document){
  // count-up
  $$('[data-count]',root).forEach(el=>{
    const to=parseFloat(el.dataset.count),dec=+(el.dataset.dec||0),dur=1400,t0=performance.now();
    const f=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=(to*e).toLocaleString('fr-FR',{minimumFractionDigits:dec,maximumFractionDigits:dec}).replace(/ /g,' ');if(p<1)requestAnimationFrame(f)};
    requestAnimationFrame(f);
  });
  setTimeout(()=>{
    $$('[data-ring]',root).forEach(el=>el.style.strokeDashoffset=el.dataset.ring);
    $$('[data-w]',root).forEach(el=>el.style.width=el.dataset.w);
    $$('[data-h]',root).forEach(el=>el.style.height=el.dataset.h);
    $$('[data-dash]',root).forEach(el=>el.setAttribute('stroke-dasharray',el.dataset.dash));
    $$('[data-draw]',root).forEach(el=>{el.style.transition='stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)';el.style.strokeDashoffset=0});
  },80);
  // tabs ink
  $$('.tabs',root).forEach(placeInk);
  tickCountdowns();
}
function placeInk(tabs){
  let ink=tabs.querySelector('.tab-ink');if(!ink){ink=document.createElement('i');ink.className='tab-ink';tabs.appendChild(ink)}
  const on=tabs.querySelector('.tab.on');if(!on){ink.style.width=0;return}
  ink.style.left=on.offsetLeft+'px';ink.style.width=on.offsetWidth+'px';
}
/* ripple */
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.btn');if(!b)return;
  const r=b.getBoundingClientRect(),s=document.createElement('span');s.className='ripple';
  const d=Math.max(r.width,r.height);s.style.width=s.style.height=d+'px';s.style.left=e.clientX-r.left-d/2+'px';s.style.top=e.clientY-r.top-d/2+'px';
  b.appendChild(s);setTimeout(()=>s.remove(),650);
});
/* generic tab switching: <div class="tabs" data-tabs="grp"> buttons .tab[data-tab=x], panes [data-pane="grp:x"] */
document.addEventListener('click',e=>{
  const t=e.target.closest('.tab[data-tab]');if(!t)return;
  const tabs=t.closest('.tabs'),grp=tabs.dataset.tabs;
  $$('.tab',tabs).forEach(x=>x.classList.toggle('on',x===t));placeInk(tabs);
  if(grp){$$(`[data-pane^="${grp}:"]`).forEach(p=>{const on=p.dataset.pane===grp+':'+t.dataset.tab;p.hidden=!on;if(on){p.classList.remove('view-enter');void p.offsetWidth;p.classList.add('view-enter');enhance(p)}})}
  if(tabs.dataset.filter){filterRows(tabs.dataset.filter,t.dataset.tab)}
});
function filterRows(tbl,val){
  let i=0;$$(`#${tbl} tbody tr`).forEach(tr=>{const show=val==='all'||tr.dataset.st===val;tr.hidden=!show;if(show){tr.style.setProperty('--i',i++);tr.style.animation='none';void tr.offsetWidth;tr.style.animation=''}});
}

});

const TR_SEP=[' · ',' — ',' : ',' › '];
function trKey(k){
  if(!k)return null;
  if(Object.prototype.hasOwnProperty.call(AR,k))return AR[k];
  for(const [re,rep] of AR_RX){if(re.test(k))return k.replace(re,rep)}
  for(const sep of TR_SEP){if(k.includes(sep)){let ch=false;const out=k.split(sep).map(p=>{const t=trKey(p.trim());if(t!=null){ch=true;return t}return p});if(ch)return out.join(sep)}}
  const m=k.match(/^([—·\s]*)(.*?)([\s:,.!?…·—]*)$/);if(m&&(m[1]||m[3])&&m[2]&&m[2]!==k){const t=trKey(m[2]);if(t!=null)return m[1]+t+m[3].replace('?','؟').replace(',','،')}
  return null;
}
function trText(node){
  const v=node.nodeValue;if(!v||!v.trim())return;
  const k=v.trim();const t=trKey(k);
  if(t!=null&&t!==k){if(node.__fr==null)node.__fr=v;node.nodeValue=v.replace(k,t)}
}
const TR_ATTR=['placeholder','title','aria-label'];
function translateTree(root){
  if(LANG!=='ar'||!root)return;
  if(root.nodeType===3){trText(root);return}
  if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;return p&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)?2:1}});
  let n;while((n=w.nextNode()))trText(n);
  const els=[root,...root.querySelectorAll('[placeholder],[title],[aria-label]')];
  els.forEach(el=>TR_ATTR.forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(!v)return;const t=trKey(v.trim());if(t!=null&&t!==v){if(!el.dataset['fr'+a])el.dataset['fr'+a]=v;el.setAttribute(a,t)}}));
  root.querySelectorAll('input[type=text],input:not([type])').forEach(t=>{const k=t.value.trim();const tr=trKey(k);if(tr!=null&&!t.__fr){t.__fr=t.value;t.value=tr}});
  root.querySelectorAll('textarea').forEach(t=>{const k=t.value.trim();const tr=trKey(k);if(tr!=null&&!t.__fr){t.__fr=t.value;t.value=tr}});
}
function restoreTree(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){if(n.__fr!=null){n.nodeValue=n.__fr;n.__fr=null}}

}

function star8pts(cx,cy,R,r,rot=0){const p=[];for(let i=0;i<16;i++){const a=(Math.PI/8)*i-Math.PI/2+rot*Math.PI/180;const rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(2)+','+(cy+rr*Math.sin(a)).toFixed(2))}return p.join(' ')}
function emblem(s=40){
  /* Logo : dossier d'appel d'offres + sceau d'attribution (transparence et validation) */
  return `<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true" class="emb"><defs><linearGradient id="egr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E88E5"/><stop offset="1" stop-color="#0A5BB5"/></linearGradient></defs>
  <rect x="1" y="1" width="46" height="46" rx="13" fill="url(#egr)"/>
  <path d="M15 9.5h12.5l7 7V36a2.2 2.2 0 0 1-2.2 2.2H15A2.2 2.2 0 0 1 12.8 36V11.7A2.2 2.2 0 0 1 15 9.5z" fill="#fff"/>
  <path d="M27.5 9.5v5a2 2 0 0 0 2 2h5z" fill="#C9D9EE"/>
  <path d="M17 21h11M17 25.2h11M17 29.4h6" stroke="#0A5BB5" stroke-width="1.9" stroke-linecap="round"/>
  <g class="emb-seal"><circle cx="32.5" cy="33.5" r="7.2" fill="#C9A227" stroke="#0B2545" stroke-width="1.6"/><path d="M29.4 33.6l2.1 2.1 3.9-4.3" fill="none" stroke="#0B2545" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
}
function wordmark(sub='Portail national des Marchés Publics'){
  return `<div class="wm"><div class="wm-t">marchés<b>publics</b></div>${sub?`<div class="wm-s">${sub}</div>`:''}</div>`;
}
function zelligeTile(id,c='#fff',sw=1.1){
  const star=(x,y)=>`<polygon points="${star8pts(x,y,30,22.5)}"/><polygon points="${star8pts(x,y,14,10.5,22.5)}"/><circle cx="${x}" cy="${y}" r="3.5"/>`;
  const cross=(x,y)=>`<polygon points="${x},${y-12} ${x+5},${y-5} ${x+12},${y} ${x+5},${y+5} ${x},${y+12} ${x-5},${y+5} ${x-12},${y} ${x-5},${y-5}"/>`;
  return `<pattern id="${id}" width="120" height="120" patternUnits="userSpaceOnUse"><g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linejoin="round">${star(60,60)}${[[0,0],[120,0],[0,120],[120,120]].map(([x,y])=>star(x,y)).join('')}${[[60,0],[0,60],[120,60],[60,120]].map(([x,y])=>cross(x,y)).join('')}<path d="M60 12v18M60 90v18M12 60h18M90 60h18"/><path d="M38.8 38.8 21.2 21.2M81.2 38.8l17.6-17.6M38.8 81.2l-17.6 17.6M81.2 81.2l17.6 17.6"/></g></pattern>`;
}

/* ================= DIAGNOSTIC ================= */
function viewDiag(){
  return appLayout('entreprise','/entreprise/diagnostic','Se préparer à répondre',`
  <div class="page-title"><div><h1>Diagnostic du poste de travail</h1><p>Vérifiez la configuration avant de déposer une réponse, puis testez sur une consultation de test.</p></div><div class="sp"><button class="btn btn-primary" onclick="runDiag()">${ic('refresh','sm')} Relancer le test</button></div></div>
  <div class="cols c-2-1" style="align-items:start">
    <div class="card" data-a id="diag">${[['laptop','Système d’exploitation et navigateur','Version et compatibilité'],['layers','Environnement d’exécution','Composants nécessaires à la signature'],['pen','Module de signature électronique','Lancement et communication'],['key','Capacité cryptographique','Accès au certificat et algorithmes'],['globe','Connexion sécurisée','TLS et accès à la plateforme']].map(([i,t,s],k)=>`<div class="diag" id="dg${k}"><div class="di">${ic(i)}</div><div style="flex:1"><b style="font-size:13.5px">${t}</b><div class="muted dgs" style="font-size:12.5px">${s}</div></div><span class="dgb"><span class="badge plain b-neutral">En attente</span></span></div>`).join('')}</div>
    <div style="display:grid;gap:16px">
      <div class="card card-pad" data-a style="--d:1;text-align:center"><div class="ring-wrap" style="width:130px;height:130px">${ringSVG(0,130,10,'#2E7D32')}<div class="ring-c"><div><div class="big" id="dscore">0/5</div><div class="muted" style="font-size:11.5px">tests réussis</div></div></div></div><p id="dsum" class="muted" style="margin-top:12px;font-size:13px">Analyse en cours…</p></div>
      <div class="card card-pad" data-a style="--d:2"><b>Consultation de test</b><p class="muted" style="font-size:13px;margin:6px 0 12px">Déposez une vraie réponse sur une consultation fictive pour valider toute la chaîne.</p><button class="btn btn-gold" style="width:100%" data-go="/entreprise/repondre/AO-33/2026/AGR">${ic('send','sm')} Faire un dépôt de test</button></div>
    </div>
  </div>`);
}
function runDiag(){
  if(!document.getElementById('dg0'))return;
  const res=['Navigateur à jour · compatible','Composants présents','Module démarré en 0,8 s','Certificat détecté · RSA 2048','TLS 1.3 · latence 42 ms'];let ok=0;
  $$('.diag').forEach(d=>{d.className='diag';$('.dgb',d).innerHTML='<span class="badge plain b-neutral">En attente</span>'});
  const ring=$('.ring-wrap .ring-fg');const C=+ring.getAttribute('stroke-dasharray');ring.style.strokeDashoffset=C;$('#dscore').textContent='0/5';$('#dsum').textContent='Analyse en cours…';
  [0,1,2,3,4].forEach(k=>{
    setTimeout(()=>{const d=$('#dg'+k);if(!d)return;d.classList.add('run');$('.dgb',d).innerHTML='<span class="badge plain b-primary">Test…</span>'},k*900);
    setTimeout(()=>{const d=$('#dg'+k);if(!d)return;d.classList.remove('run');d.classList.add('ok');$('.di',d).innerHTML=ic('check');$('.dgs',d).textContent=res[k];$('.dgb',d).innerHTML='<span class="badge b-success">Conforme</span>';ok++;$('#dscore').textContent=ok+'/5';ring.style.strokeDashoffset=C*(1-ok/5);
      if(ok===5){$('#dsum').innerHTML='<b style="color:var(--color-success)">Votre poste est prêt</b> pour la réponse électronique.';toast('Diagnostic terminé : poste conforme','success')}},k*900+800);
  });
}

function route(){
  const raw=location.hash.slice(1)||'/';const [path,qs]=raw.split('?');const q=new URLSearchParams(qs||'');
  let html,after;
  const m=(re)=>path.match(re);
  if(path==='/')html=viewHome(),after=startFeed;
  else if(path==='/consultations')html=viewSearch();
  else if(m(/^\/consultation\/(.+)$/))html=viewDetail(decodeURIComponent(m(/^\/consultation\/(.+)$/)[1]));
  else if(path==='/acces')html=viewAccess(q);
  else if(path==='/annonces')html=viewAnnonces(q);
  else if(path==='/societes-exclues')html=viewExclues(q);
  else if(path==='/preparer')html=viewPreparer(q),after=runDiag;
  else if(path==='/support')html=viewSupport(q);
  else if(path==='/aide')html=viewAide(q);
  else if(path==='/plan-du-site')html=viewSitemap();
  else if(path==='/comptable')html=viewComptable(q);
  else if(path==='/organisme')html=viewOrganisme(q);
  else if(path==='/acheteur')html=viewAchDash(),after=startActFeed;
  else if(path==='/acheteur/consultations')html=viewAchList();
  else if(path==='/acheteur/creer')html=viewCreate();
  else if(m(/^\/acheteur\/consultation\/(.+)$/))html=viewAchDetail(decodeURIComponent(m(/^\/acheteur\/consultation\/(.+)$/)[1]));
  else if(m(/^\/acheteur\/plis\/(.+)$/))html=viewPlis(decodeURIComponent(m(/^\/acheteur\/plis\/(.+)$/)[1]));
  else if(path==='/acheteur/messagerie')html=viewMsg();
  else if(path==='/acheteur/archives')html=viewArchives();
  else if(path==='/acheteur/fournisseurs')html=viewSuppliers(q);
  else if(path==='/admin/parametrage')html=viewAdminParam();
  else if(path==='/admin/statistiques')html=viewStats();
  else if(path==='/entreprise')html=viewEntDash();
  else if(path==='/entreprise/coffre-fort')html=viewVault();
  else if(m(/^\/entreprise\/repondre\/(.+)$/))html=viewDepot(decodeURIComponent(m(/^\/entreprise\/repondre\/(.+)$/)[1]));
  else if(path==='/entreprise/depots')html=viewDepots();
  else if(path==='/entreprise/profil')html=viewProfil(q);
  else if(path==='/entreprise/diagnostic')html=viewDiag(),after=runDiag;
  else html=viewHome(),after=startFeed;
  closeModal();closePlan();
  $('#app').innerHTML=html;window.scrollTo(0,0);enhance($('#app'));if(after)setTimeout(after,300);
  $$('.drawer-link').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+raw));
  const h=$('#phead');if(h){const f=()=>h.classList.toggle('scrolled',scrollY>10);window.onscroll=f;f()}else window.onscroll=null;
}
function openMobile(dev){
  dev=dev||'phone';closeMobile();
  const base=location.href.split('#')[0].split('?')[0];
  const W={phone:[390,844],tablet:[820,1180]}[dev];
  const H=Math.min(window.innerHeight-110,W[1]);const sc=Math.min(1,H/W[1]);
  document.body.insertAdjacentHTML('beforeend',`<div class="mob-ov" onclick="if(event.target===this)closeMobile()"><div class="mob-bar"><div class="seg"><button class="${dev==='phone'?'on':''}" onclick="openMobile('phone')">${ic('phone','sm')} Mobile · 390</button><button class="${dev==='tablet'?'on':''}" onclick="openMobile('tablet')">${ic('laptop','sm')} Tablette · 820</button></div><span class="mob-lang">${langBtns()}</span><button class="icon-btn" style="color:#fff" onclick="closeMobile()">${ic('x')}</button></div>
  <div class="mob-frame ${dev}" style="width:${W[0]*sc+24}px;height:${W[1]*sc+24}px"><div class="mob-notch"></div><iframe src="${base}?embed=1&lang=${LANG}${location.hash}" style="width:${W[0]}px;height:${W[1]}px;transform:scale(${sc})"></iframe></div></div>`);
}
function closeMobile(){document.querySelectorAll('.mob-ov').forEach(x=>x.remove())}
function openPlan(){$('.drawer').classList.add('open');$('.drawer-bg').classList.add('open')}
function closePlan(){$('.drawer')?.classList.remove('open');$('.drawer-bg')?.classList.remove('open')}
function buildPlan(){
  const n=PLAN.reduce((a,g)=>a+g[1].length,0);
  document.body.insertAdjacentHTML('beforeend',`
  <div class="concept">Maquette conceptuelle · données fictives</div>
  <button class="mob-btn" onclick="openMobile()" title="Aperçu mobile">${ic('phone','sm')}<span class="pl-t">Aperçu mobile</span></button>
  <button class="plan-btn" onclick="openPlan()"><span class="dot"></span>${ic('grid','sm')}<span class="pl-t">Plan de la maquette · ${n} écrans</span></button>
  <div class="drawer-bg" onclick="closePlan()"></div>
  <aside class="drawer"><div class="drawer-head"><div style="display:flex;align-items:center;gap:12px">${emblem(38)}<div><h3>Plan de la maquette</h3><div style="font-size:12px;color:#B8C6DA">${n} écrans · 6 profils · navigation libre</div></div><button class="icon-btn" style="margin-left:auto;color:#fff" onclick="closePlan()">${ic('x')}</button></div></div>
  <div class="drawer-body">${PLAN.map(([g,ls])=>`<div class="drawer-group"><h4>${g}</h4>${ls.map(([h,i,t],k)=>`<a class="drawer-link" href="#${h}">${ic(i)}${t}<span class="n">${String(k+1).padStart(2,'0')}</span></a>`).join('')}</div>`).join('')}</div></aside>`);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closePlan()}});

window.addEventListener('resize',()=>$$('.tabs').forEach(placeInk));
applyDir();if(EMBED)document.body.classList.add('embed');buildPlan();route();if(LANG==='ar')translateTree(document.body);
